<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mongrel Games</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b20;--mute:#6b6670;--acc:#d6336c;--acc2:#2b8a3e;--line:#e3ddd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151a;--card:#232027;--ink:#f1eef3;--mute:#a49eab;--acc:#ff6b9d;--acc2:#69db7c;--line:#38333f}}
:root[data-theme="dark"]{--bg:#17151a;--card:#232027;--ink:#f1eef3;--mute:#a49eab;--acc:#ff6b9d;--acc2:#69db7c;--line:#38333f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;margin:6px 0 2px}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:0 0 10px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.code{font-size:34px;letter-spacing:.25em;font-weight:800;text-align:center;margin:4px 0}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:3px 4px 3px 0;font-size:14px}
.big{font-size:30px;font-weight:800;text-align:center;margin:10px 0}
.imp{color:var(--acc)}.ok{color:var(--acc2)}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}.chk input{width:auto;margin:0}
.vote{display:flex;justify-content:space-between;width:100%;margin:0 0 8px}
.err{color:var(--acc);margin:0 0 10px}.mute{color:var(--mute);font-size:14px}
a.lnk{color:var(--mute);cursor:pointer;text-decoration:underline;font-size:14px}

body{background:radial-gradient(circle at 8% 0,rgba(214,51,108,.18),transparent 38%),radial-gradient(circle at 100% 25%,rgba(28,126,214,.16),transparent 38%),var(--bg);background-attachment:fixed;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}

 else if(ph==="clue")b=`<div class="card" style="text-align:center"><div class="mute">Theme · ⏱ <b data-dl="${r.dl||0}"></b></div><div class="big" style="margin:4px 0">${esc(r.theme)}</div>${dial({target:mk?r.target:null})}${sides(r)}${mk?`<p class="mute">The red/orange/yellow zone is the secret target. Give a clue that fits that spot.</p><input id="wc" maxlength="30" placeholder="Your clue, e.g. Apple"><button style="width:100%" onclick="sendClue()">Send clue to guessers</button>`:`<p class="mute">🔮 ${esc(P(r.maker).name)} is thinking of a clue…</p>`}</div>`;

 else if(r.phase==="play"){b=`<div class="card" style="text-align:center"><div class="mute">Round ${rn(r)}/${r.rounds||5} · Category</div><div class="big">${esc(r.category)}</div>
  ${S.show?(me?`<div class="big imp">You are the IMPOSTOR</div><p class="mute">Blend in — you don’t know the word.</p>${r.hintOn&&(r.hr||1)===1&&(r.order||[])[0]===S.uid?`<p class="ok"><b>Hint:</b> ${r.hint?esc(r.hint):`the word contains the letter “${esc(r.hintLetter||"?")}”`}</p>`:""}`:`<div class="mute">The secret word is</div><div class="big ok">${esc(r.word)}</div>`):""}
  <button class="ghost" onclick="S.show=!S.show;render()">${S.show?"Hide my role":"Tap to see my role"}</button></div>
  ${guessBox(r)}${hintsUI(r)}`}
 else if(r.phase==="vote"){const mine=(S.players.find(p=>p.id===S.uid)||{}).vote,voted=S.players.filter(p=>p.vote&&p.vote.round===r.round).length;
  b=`<div class="card"><h2>Who is the impostor?</h2>${S.players.filter(p=>p.id!==S.uid).map(p=>`<button class="vote ${mine&&mine.round===r.round&&mine.target===p.id?"":"ghost"}" onclick="castVote('${p.id}')"><span>${esc(p.name)}</span><span>${mine&&mine.round===r.round&&mine.target===p.id?"✓":""}</span></button>`).join("")}<p class="mute">⏱ <b data-dl="${r.dl||0}"></b> · ${voted}/${S.players.length} voted</p></div>${guessBox(r)}${h?`<button style="width:100%" onclick="setPhase('result')">Show results</button>`:""}`}
 else{const g=r.guess!=null,t={};S.players.forEach(p=>{if(p.vote&&p.vote.round===r.round)t[p.vote.target]=(t[p.vote.target]||0)+1});
  const mx=Math.max(0,...Object.values(t)),top=Object.keys(t).filter(k=>t[k]===mx),caught=top.length===1&&top[0]===r.impostor;
  b=`<div class="card" style="text-align:center"><div class="mute">The impostor was</div><div class="big imp">${esc(nameOf(r.impostor))}</div><div class="mute">The word was</div><div class="big">${esc(r.word)}</div>${g?`<div class="mute">${esc(nameOf(r.impostor))} guessed ${r.guessOk?"correctly":"incorrectly"} “${esc(r.guess)}”</div><div class="big ${r.guessOk?"imp":"ok"}">${r.guessOk?"Impostor wins! 😈":"Crew wins! 🎉"}</div>`:`<div class="big ${caught?"ok":"imp"}">${caught?"Impostor caught! 🎉":"Impostor got away 😈"}</div>`}
  <div>${S.players.map(p=>`<span class="pill">${esc(p.name)}: ${t[p.id]||0} vote${(t[p.id]||0)===1?"":"s"}</span>`).join("")}</div></div>
  ${h?(last(r)?`<p class="mute" style="text-align:center">That was the last round!</p><button style="width:100%" onclick="setPhase('lobby')">Back to lobby</button>`:`<div class="row"><button onclick="startRound()">Next round</button><button class="ghost" onclick="setPhase('lobby')">Back to lobby</button></div>`):""}`}
 return `<h1>Mongrel Games</h1><p class="sub">Guess the Impostor</p>${head}${S.err?`<p class="err">${esc(S.err)}</p>`:""}${b}<p style="text-align:center;margin-top:18px"><a class="lnk" onclick="leave()">Leave room</a></p>`}

const guard=async f=>{try{S.err="";await f()}catch(e){S.err="Something went wrong: "+(e&&e.message||e.code||"try again");console.error(e)}render()};
const needName=()=>{S.name=S.name.trim();if(!S.name){S.err="Please enter a nickname first.";render();return false}return true};
function togCat(n,on){on?S.sel.add(n):S.sel.delete(n);render()}
function createRoom(){if(!needName())return;guard(async()=>{const code=Array.from({length:4},()=>pick("ABCDEFGHJKLMNPQRSTUVWXYZ")).join("");
 await S.db.doc("rooms/"+code).set({host:S.uid,phase:"lobby",round:0,created:Date.now(),game:S.game||"imp"});await enter(code)})}
function joinRoom(c){if(!needName())return;c=(c||"").trim().toUpperCase();guard(async()=>{const s=await S.db.doc("rooms/"+c).get();if(!s.exists){S.err="No room with that code.";return}if((s.data().kicked||[]).includes(S.uid)){S.err="You were removed from that room.";return}S.game=s.data().game||"imp";await enter(c)})}
async function enter(code){await S.db.doc(`rooms/${code}/players/${S.uid}`).set({name:S.name,joined:Date.now()});ls.set("room",code);sub(code)}
function sub(code){unsub();S.code=code;S.adv=null;S.claim=null;S.rseen={};S.rinit=false;S.page="home";
 S.unsubs.push(S.db.doc("rooms/"+code).onSnapshot(s=>{S.room=s.exists?s.data():null;kickCheck();shotSync();if(S.room){const ph=S.room.phase;if(ph!==S.lastPhase){if(ph==="reveal"){const p=(S.room.pts||{})[S.uid]||0;p?chord(p>=3?[523,659,784,1047]:[523,659]):beep(190,.3,"sawtooth",.05)}if(ph==="result")chord([392,523,659])}S.lastPhase=ph}if(S.room&&S.room.phase==="play")S.show=S.show&&S.lastRound===S.room.round;S.lastRound=S.room&&S.room.round;render()},e=>{S.err="Connection problem.";render()}));
 S.unsubs.push(S.db.collection(`rooms/${code}/players`).onSnapshot(q=>{S.players=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.joined-b.joined);checkReacts();render()}))}
function unsub(){S.unsubs.forEach(f=>f());S.unsubs=[]}
function startRound(){guard(async()=>{if(!S.sel)S.sel=new Set(cats().map(c=>c.name));const cs=cats().filter(c=>S.sel&&S.sel.has(c.name)&&c.words.length);if(!cs.length){S.err="Select a category with words.";return}
 const c=pick(cs),w=pick(c.words),ps=S.players;await S.db.doc("rooms/"+S.code).update({phase:"play",guess:null,guessOk:null,round:(S.room.round||0)+1,r0:S.room.phase==="lobby"?(S.room.round||0):(S.room.r0||0),category:c.name,word:w,hint:c.hints[w.toLowerCase()]||null,hintLetter:letterOf(w),impostor:pick(ps).id,hr:1,order:shuffle(ps.map(p=>p.id)),dl:Date.now()+30000});S.show=false})}
function setPhase(p){guard(()=>S.db.doc("rooms/"+S.code).update({phase:p}))}
function castVote(t){guard(()=>S.db.doc(`rooms/${S.code}/players/${S.uid}`).update({vote:{round:S.room.round,target:t}}))}
function leave(){guard(async()=>{shotStop();const c=S.code;unsub();S.code=null;S.room=null;S.players=[];ls.set("room","");await S.db.doc(`rooms/${c}/players/${S.uid}`).delete()})}
function saveCat(name,words){name=(name||"").trim();const items=(words||"").split(/[,\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf("=");return i>0?{w:x.slice(0,i).trim(),h:x.slice(i+1).trim()}:{w:x,h:""}}).filter(x=>x.w),ws=items.map(x=>x.w);
 if(!name||!ws.length){S.err="Enter a name and at least one word.";render();return}
 guard(async()=>{const ref=S.db.collection("custom").doc(hash(name)),s=await ref.get(),od=s.exists?s.data():{},all=[...(od.words||[])],hints=[...(od.hints||[])];
  items.forEach(({w,h})=>{if(!all.some(x=>x.toLowerCase()===w.toLowerCase()))all.push(w);if(h){const k=hints.findIndex(y=>y.w.toLowerCase()===w.toLowerCase());if(k>=0)hints[k]={w,h};else hints.push({w,h})}});
  await ref.set({name,words:all,hints,removed:(od.removed||[]).filter(x=>!ws.some(w=>w.toLowerCase()===x.toLowerCase())),hidden:false});S.page="manage"})}

(async()=>{S.name=ls.get("nick");
 try{firebase.initializeApp(FIREBASE_CONFIG);const cred=await firebase.auth().signInAnonymously();S.uid=cred.user.uid;S.db=firebase.firestore()}catch(e){console.error(e);S.db=null}
 render();if(!S.db)return;
 S.db.collection("custom").onSnapshot(q=>{S.custom=q.docs.map(d=>d.data());render()},()=>{});
 const inv=(new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();
 if(/^[A-Z]{4}$/.test(inv)){S.inv=inv;try{history.replaceState(null,"",location.href.split("?")[0])}catch(e){}if(S.name)joinRoom(inv);else{S.page="invite";render()}return}
 const last=ls.get("room");if(last&&S.name){try{const s=await S.db.doc(`rooms/${last}/players/${S.uid}`).get();if(s.exists)sub(last)}catch(e){}}
})();
</script>
